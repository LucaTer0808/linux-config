# Catppuccin Mocha Theme laden
include mocha.conf

# Schriftart (weich und modern)
font_family JetBrainsMono Nerd Font
font_size        11.5

# Transparenz & Weichzeichner (0.85 = 85% Deckkraft)
background_opacity 0.90

# Fenster-Padding für einen luftigeren Look
window_padding_width 12

# Lavendel Cursor (#b4befe)
cursor #b4befe
cursor_text_color #1e1e2e

# Lavendel Textselektion
selection_foreground #1e1e2e
selection_background #b4befe

# Fenster-Rahmen
active_border_color #b4befe
inactive_border_color #313244

# Cursor Trail (Schweif-Effekt)
cursor_shape                 block
cursor_blink_interval        0
cursor_trail                 3
cursor_trail_decay           0.1 0.35
cursor_trail_start_threshold 0
